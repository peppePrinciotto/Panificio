<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — Panificio Roccafiorita</title>

  <!-- Google Fonts (stessi del sito pubblico) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lora:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

  <!-- ============================================================
       SCHERMATA DI LOGIN
       Visibile quando la sessione non è attiva
  ============================================================ -->
  <div class="login-screen" id="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <span>Panificio</span> Roccafiorita
      </div>
      <h1 class="login-title">Accesso Amministratore</h1>

      <div class="login-error" id="login-error" role="alert" aria-live="polite" style="display:none;"></div>
      <div class="login-lockout" id="login-lockout" role="alert" aria-live="polite" style="display:none;">
        Troppi tentativi. Attendi <span id="lockout-countdown">60</span>s.
      </div>

      <form id="login-form" autocomplete="off" novalidate>
        <div class="login-field">
          <label for="admin-password">Password</label>
          <input type="password" id="admin-password" name="password"
                 autocomplete="current-password" autofocus
                 placeholder="••••••••••••" aria-describedby="login-error" />
        </div>
        <button type="submit" class="login-btn" id="login-btn">Accedi</button>
      </form>
    </div>
  </div>

  <!-- ============================================================
       PANNELLO ADMIN
       Visibile quando la sessione è attiva
  ============================================================ -->
  <div class="admin-layout" id="admin-layout" style="display:none;">

    <!-- Sidebar -->
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="sidebar-brand">
        <span>Panificio</span> Roccafiorita
      </div>

      <nav class="sidebar-nav" aria-label="Navigazione admin">
        <a href="#" class="sidebar-link active" data-section="dashboard">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="#" class="sidebar-link" data-section="products">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
          Prodotti
        </a>
        <a href="#" class="sidebar-link" data-section="reservations">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Prenotazioni
        </a>
        <a href="#" class="sidebar-link" data-section="content">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Testi
        </a>

        <div class="sidebar-sep"></div>

        <a href="index.html" class="sidebar-link" target="_blank">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          Vedi sito
        </a>
        <button class="sidebar-link logout-btn" id="logout-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Esci
        </button>
      </nav>
    </aside>

    <!-- Contenuto principale -->
    <div class="admin-main">

      <!-- Topbar -->
      <header class="admin-topbar">
        <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" aria-label="Apri/chiudi menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h2 class="topbar-title" id="topbar-title">Dashboard</h2>
        <div class="topbar-user">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Amministratore
        </div>
      </header>

      <!-- Sezione Dashboard -->
      <section class="admin-section" id="section-dashboard" data-title="Dashboard">
        <div id="dashboard-content">
          <!-- Popolato da admin-dashboard.js -->
        </div>
      </section>

      <!-- Sezione Prodotti -->
      <section class="admin-section" id="section-products" data-title="Prodotti" style="display:none;">
        <div id="products-content">
          <!-- Popolato da admin-products.js -->
        </div>
      </section>

      <!-- Sezione Prenotazioni -->
      <section class="admin-section" id="section-reservations" data-title="Prenotazioni" style="display:none;">
        <div id="reservations-content">
          <!-- Popolato da admin-reservations.js -->
        </div>
      </section>

      <!-- Sezione Testi -->
      <section class="admin-section" id="section-content" data-title="Testi">
        <div id="content-content" style="display:none;">
          <!-- Popolato da admin-content.js -->
        </div>
      </section>

    </div>
  </div>

  <!-- ============================================================
       MODAL PRODOTTO (condiviso tra aggiungi e modifica)
  ============================================================ -->
  <div class="modal-overlay" id="product-modal-overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="product-modal-title">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="product-modal-title">Modifica Prodotto</h3>
        <button class="modal-close-btn" id="product-modal-close" aria-label="Chiudi">
          <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="product-form" novalidate>
          <input type="hidden" id="product-id-field" />

          <div class="form-row">
            <div class="form-group">
              <label for="p-name">Nome prodotto *</label>
              <input type="text" id="p-name" required />
              <span class="form-error" id="p-name-err"></span>
            </div>
            <div class="form-group">
              <label for="p-price">Prezzo unitario (€) *</label>
              <input type="number" id="p-price" step="0.50" min="0.50" required />
              <span class="form-error" id="p-price-err"></span>
            </div>
          </div>

          <div class="form-group">
            <label for="p-shortdesc">Descrizione breve * <span class="char-counter"><span id="p-shortdesc-count">0</span>/500</span></label>
            <textarea id="p-shortdesc" rows="3" maxlength="500" required></textarea>
            <span class="form-error" id="p-shortdesc-err"></span>
          </div>

          <div class="form-group">
            <label for="p-longdesc">Descrizione lunga (opzionale)</label>
            <textarea id="p-longdesc" rows="4"></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="p-minkg">Quantità minima</label>
              <input type="number" id="p-minkg" step="1" min="1" value="1" />
            </div>
            <div class="form-group">
              <label for="p-weight">Peso per pezzo (g)</label>
              <input type="number" id="p-weight" step="1" min="1" placeholder="es. 350" />
            </div>
          </div>

          <div class="form-group">
            <label for="p-stock">Unità disponibili in magazzino</label>
            <input type="number" id="p-stock" step="1" min="0" placeholder="Illimitato" />
            <span class="form-note" style="font-size:0.78rem;color:var(--color-text-muted);margin-top:0.2rem;display:block;">Lascia vuoto = illimitato · 0 = esaurito</span>
          </div>

          <div class="form-group">
            <label>Immagine prodotto</label>
            <div class="img-upload-area" id="img-upload-area">
              <img id="p-img-preview" class="img-preview" alt="Anteprima" style="display:none;" />
              <div class="img-upload-prompt" id="img-upload-prompt">
                <svg viewBox="0 0 24 24" aria-hidden="true" width="32" height="32"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <span>Clicca o trascina un'immagine qui</span>
                <span class="img-upload-hint">JPG, PNG, WebP — max 5 MB</span>
              </div>
              <input type="file" id="p-imageupload" accept="image/*" style="display:none;" />
            </div>
            <input type="hidden" id="p-imageurl" />
            <button type="button" class="btn-admin btn-ghost btn-sm img-remove-btn" id="img-remove-btn" style="display:none; margin-top:0.5rem;">✕ Rimuovi immagine</button>
          </div>

          <div class="form-group form-toggle-group">
            <label class="toggle-label">
              <input type="checkbox" id="p-available" checked />
              <span class="toggle-track"></span>
              Prodotto visibile sul sito
            </label>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn-admin btn-danger" id="product-delete-btn" style="display:none;">Elimina</button>
            <div style="display:flex; gap: 0.75rem; margin-left:auto;">
              <button type="button" class="btn-admin btn-ghost" id="product-cancel-btn">Annulla</button>
              <button type="submit" class="btn-admin btn-primary">Salva</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- SCRIPT: config.js prima degli admin JS -->
  <script src="js/config.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/admin-dashboard.js"></script>
  <script src="js/admin-products.js"></script>
  <script src="js/admin-reservations.js"></script>
  <script src="js/admin-content.js"></script>
</body>
</html>

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  # js/config.js contiene SOLO chiavi pubbliche frontend (Stripe publishable
  # key e Supabase anon/publishable key), pubbliche per design. Lo scanner
  # segreti di Netlify le segnala come falsi positivi perché coincidono con
  # env var impostate su Netlify. Escludiamo quel singolo file (e la chiave
  # Stripe per nome) dallo scanner.
  # ATTENZIONE: NON inserire MAI in config.js chiavi server-side
  # (sk_live, GMAIL_APP_PASSWORD, RESEND_API_KEY, TELEGRAM_BOT_TOKEN, ADMIN_HASH):
  # quelle restano scansionate ovunque e non devono comparire nel repo.
  SECRETS_SCAN_OMIT_KEYS  = "STRIPE_PUBLISHABLE_KEY"
  SECRETS_SCAN_OMIT_PATHS = "js/config.js"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://js.stripe.com https://www.paypal.com https://www.paypalobjects.com https://fonts.googleapis.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://js.stripe.com https://www.paypal.com https://www.google.com/maps/; connect-src 'self' https://api.stripe.com https://www.paypal.com https://oyzlsznibhjnpejzkncw.supabase.co https://fonts.googleapis.com; form-action 'self';"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store, no-cache"

[[headers]]
  for = "/js/*.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache"
